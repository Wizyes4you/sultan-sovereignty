name: Deploy Sultan Sovereignty Platform

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Production Assets
        run: npm run build

      - name: Verify Build Output Directory
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "❌ Build failed: dist directory is empty"
            exit 1
          fi
          echo "✓ Build verification passed"

      - name: Process Domain Validation Key
        run: |
          if [ -f public/validation-key.txt ]; then
            cp public/validation-key.txt dist/validation-key.txt
            echo "✓ Validation key copied successfully"
          else
            echo "⚠ Warning: validation-key.txt not found in public directory"
          fi

      - name: Configure GitHub Pages Hosting
        uses: actions/configure-pages@v5

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Execute Live Deployment
        id: deployment
        uses: actions/deploy-pages@v4
        
