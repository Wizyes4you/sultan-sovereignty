<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SULTAN | صرح سلطان 114Hz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
        :root { --gold: #D4AF37; --deep: #020617; --water: #1e40af; }
        body { background: var(--deep); color: white; font-family: 'Amiri', serif; margin: 0; padding-bottom: 80px; }
        .water-bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 100%, var(--water) 0%, var(--deep) 80%); opacity: 0.4; z-index: -1; }
        .gold-border { border: 1px solid rgba(212, 175, 55, 0.4); }
        .gold-text { color: var(--gold); }
        .heart-yas { animation: pulse 1.9s infinite; text-shadow: 0 0 20px var(--gold); }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>
<body class="min-h-screen">
    <div class="water-bg"></div>

    <!-- Header -->
    <header class="text-center py-6 border-b border-yellow-600/30 bg-slate-950/80 sticky top-0 z-50 backdrop-blur-md">
        <h1 class="text-3xl font-bold gold-text tracking-wide">صرح سُلطان 114Hz</h1>
        <p class="text-xs text-slate-400 mt-1">SULTAN Sovereign DApp - Yas Protocol (36:82)</p>
    </header>

    <!-- Main Content Hub -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Status Banner -->
        <div class="p-4 rounded-2xl bg-slate-900/90 gold-border text-center shadow-lg">
            <div class="text-xs text-emerald-400 font-sans mb-1">● SYSTEM_STATUS: MAINNET_GLOBAL_LIVE</div>
            <h2 class="text-xl font-bold gold-text heart-yas">كُنْ فَيَكُونُ يس</h2>
            <p class="text-xs text-slate-300 mt-2">محفظة السيادة الإعمارية | رادار الأزمات | سوق القسطاس</p>
        </div>

        <!-- 8 Sovereign Gates Grid -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="triggerAid()" class="p-3 rounded-xl bg-slate-800/80 gold-border hover:bg-slate-700 transition text-right">
                <div class="text-sm font-bold text-amber-300">ركن الإغاثة (غزة/السودان)</div>
                <div class="text-[10px] text-slate-400">One-Tap-Aid Radar</div>
            </button>
            <button class="p-3 rounded-xl bg-slate-800/80 gold-border hover:bg-slate-700 transition text-right">
                <div class="text-sm font-bold text-amber-300">سوق القسطاس</div>
                <div class="text-[10px] text-slate-400">Pi-to-Life Barter</div>
            </button>
            <button class="p-3 rounded-xl bg-slate-800/80 gold-border hover:bg-slate-700 transition text-right">
                <div class="text-sm font-bold text-amber-300">محرك اقْرَأْ (التبْيَان)</div>
                <div class="text-[10px] text-slate-400">Al-Alaq AI Insight</div>
            </button>
            <button class="p-3 rounded-xl bg-slate-800/80 gold-border hover:bg-slate-700 transition text-right">
                <div class="text-sm font-bold text-amber-300">مركز البصيرة</div>
                <div class="text-[10px] text-slate-400">Accessibility Hub</div>
            </button>
        </div>

        <!-- Wallet Integration Card -->
        <div class="p-4 rounded-xl bg-amber-950/20 gold-border space-y-2">
            <div class="flex justify-between items-center text-xs text-amber-200">
                <span>المحفظة السيادية المحمية:</span>
                <span class="font-mono text-[10px] text-amber-400">GC5C...WPO6</span>
            </div>
            <button id="pay-btn" onclick="executePiPayment()" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-600 to-yellow-500 text-slate-950 font-bold text-sm shadow-md hover:brightness-110">
                تدفق الإعمار والزكاة (2.5%) - Pi SDK
            </button>
        </div>

    </main>

    <!-- Bottom Sovereign Nav -->
    <nav class="fixed bottom-0 inset-x-0 bg-slate-950 border-t border-amber-600/30 py-3 flex justify-around text-xs text-amber-200/80 backdrop-blur-lg">
        <span class="font-bold gold-text">الرئيسية</span>
        <span>الرادار</span>
        <span>السوق</span>
        <span>البصيرة</span>
    </nav>

    <script>
        // Pi SDK Initialization
        document.addEventListener('DOMContentLoaded', function() {
            if (window.Pi) {
                Pi.init({ version: "2.0", sandbox: false });
                console.log("Sultan Sovereign DApp Engine Live.");
            }
        });

        function executePiPayment() {
            if (!window.Pi) {
                alert("يرجى فتح التطبيق من داخل متصفح Pi Browser المعتمد.");
                return;
            }
            Pi.authenticate(['username', 'payments'], function(payment) {
                console.log("Authenticated: ", payment);
            });
        }

        function triggerAid() {
            alert("تم إرسال نداء الإغاثة السيادي بنجاح عبر بروتوكول يس.");
        }
    </script>
</body>
    </html>
